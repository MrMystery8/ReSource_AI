name: Deploy ReSource AI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npx tsc -p shared/tsconfig.json

      - name: Build backend
        run: npx tsc -p backend/tsconfig.json

      - name: Build infra
        run: npx tsc -p infra/tsconfig.json

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npx tsc -p shared/tsconfig.json

      - name: Build backend
        run: npx tsc -p backend/tsconfig.json

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: https://9rx4ve8q89.execute-api.ap-southeast-1.amazonaws.com/prod
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
          VITE_AUTH_MODE: cognito
          VITE_COGNITO_DOMAIN: https://resource-ai-auth-dev1.auth.ap-southeast-1.amazoncognito.com
          VITE_COGNITO_APP_CLIENT_ID: 7muh97ed5g0a9lq2hjo7ocmaeh
          VITE_COGNITO_REDIRECT_SIGN_IN: https://du1pydjgrqi6x.cloudfront.net/auth/callback
          VITE_COGNITO_REDIRECT_SIGN_OUT: https://du1pydjgrqi6x.cloudfront.net/login
          VITE_LANDING_VIDEO_URL: https://resource-ai-media-714799286226-ap-southeast-1.s3.ap-southeast-1.amazonaws.com/landing/video/laptop-to-project.mp4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: CDK deploy
        run: npx cdk deploy --require-approval never
