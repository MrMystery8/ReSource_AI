name: Deploy ReSource AI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npx tsc -p shared/tsconfig.json

      - name: Build backend
        run: npx tsc -p backend/tsconfig.json

      - name: Build infra
        run: npx tsc -p infra/tsconfig.json

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npx tsc -p shared/tsconfig.json

      - name: Build backend
        run: npx tsc -p backend/tsconfig.json

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: https://9rx4ve8q89.execute-api.ap-southeast-1.amazonaws.com/prod
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: CDK deploy
        run: npx cdk deploy --require-approval never
